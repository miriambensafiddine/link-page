<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-Space Portfolio</title>
  
  <!-- Ladda in GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
  <style>
    /* RESET & BRUTALISTISK BAS */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
     /* background-color: #8c8c8c;*/
      /* Subtil radiell gradient för 3D-djup */
      background: radial-gradient(circle at 50% 50%, #999 0%, #666 100%);
      color: #000;
      overflow-x: hidden;
     
    }

    /* CSS BRUS (NOISE) */
    .noise-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.08;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
  .grid{ background-image: linear-gradient(#404140 1px, transparent 1px), linear-gradient(to right, #404140 1px, transparent 1px);
  background-size: 40px 40px;
  background-color: #dcdcdc;
  background-attachment: fixed;}
    /* 3D RYMDEN */
    .gallery-wrapper {
      height: 400vh; /* Bestämmer hur lång scrollen är */
      position: relative;
    }

    .gallery-container {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100vw;
      perspective: 1000px; /* Skapar djupet */
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    /* BILDERNA / PROJEKTEN */
    .gallery-image {
      position: absolute;
      width: 300px;
      height: 400px;
      /* Brutalistisk placeholder-styling */
      background: #f2efef;
      border: 1px solid #000000; 
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: monospace;
      font-size: 1.5rem;
      text-transform: uppercase;
      will-change: transform, opacity;
      cursor: pointer;
    }

    /* Sprid ut dem lite i X och Y för att skapa en konstellation */
    .img-1 { left: 20%; top: 20%; }
    .img-2 { left: 60%; top: 40%; }
    .img-3 { left: 30%; top: 60%; }
    .img-4 { left: 70%; top: 10%; }
    /* Lägg till denna styling i din <style>-tagg */
.case-view {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: #8c8c8c; /* Samma neutrala bas */
  z-index: 100;
  display: none; /* Visas via JS */
  overflow-y: auto;
  padding: 40px;
}

.close-btn {
  background: #000; color: #fff; border: none;
  padding: 10px 20px; font-family: monospace;
  cursor: pointer; text-transform: uppercase;
  margin-bottom: 40px;
}

.case-hero-target {
  width: 100%; height: 50vh;
  border: 2px solid #000;
  background: #555;
  position: relative;
  overflow: hidden;
}

/* När bilden väl har flyttat in i caset vill vi att den ska fylla ut containern helt */
.case-hero-target .gallery-image {
  position: absolute;
  top: 0; left: 0; width: 100% !important; height: 100% !important;
  transform: none !important; /* Nollställ 3D-transforms efter animationen */
}

.case-content {
  margin-top: 40px;
  max-width: 800px;
  font-family: monospace;
}

.case-title { font-size: 3rem; text-transform: uppercase; margin-bottom: 10px; }
.case-meta { font-size: 1.2rem; margin-bottom: 20px; color: #333; }
.case-text { line-height: 1.6; font-size: 1.1rem; }
.next-case-section {
  margin-top: 100px;
  padding-bottom: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.next-case-heading {
  font-family: monospace;
  font-size: 2rem;
  text-transform: uppercase;
  margin-bottom: 40px;
}

.card-deck {
  position: relative;
  width: 300px;
  height: 400px;
}

.swipe-card {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: #000;
  border: 2px solid #fff;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: monospace;
  font-size: 1.5rem;
  text-transform: uppercase;
  cursor: grab;
  /* Lite skugga för att skilja dem åt i stapeln */
  box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
  will-change: transform;
}

.swipe-card:active {
  cursor: grabbing;
}
  </style>
</head>
<body>

  <div class="noise-overlay"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Flip.min.js"></script>

<div class="case-view" id="case-view">
  <button class="close-btn" id="close-btn">← Stäng projekt</button>
  <div class="case-hero-target" id="hero-target">
    </div>
  <div class="case-content">
    <h1 class="case-title">Projekttitel</h1>
    <p class="case-meta">Format / Roll / År</p>
    <div class="case-text">
      <p>Här landar den djupgående projektbeskrivningen. Genom att jobba med råa, starka kontraster och en ren layout skapar vi en brutalistisk motvikt till den flytande 3D-rymden utanför.</p>
    </div>
    <div class="next-case-section">
  <h2 class="next-case-heading">Next Project</h2>
  <div class="card-deck">
    <div class="swipe-card" style="z-index: 3;">
      <span class="card-title">Matte J</span>
    </div>
    <div class="swipe-card" style="z-index: 2;">
      <span class="card-title">LIVS</span>
    </div>
    <div class="swipe-card" style="z-index: 1;">
      <span class="card-title">Gökbot</span>
    </div>
  </div>
</div>
  </div>
</div>
  <div class="gallery-wrapper">
    <div class="gallery-container">
      <div class="gallery-image img-1">Case 1</div>
      <div class="gallery-image img-2">Case 2</div>
      <div class="gallery-image img-3">Case 3</div>
      <div class="gallery-image img-4">Case 4</div>
    </div>
  </div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const images = gsap.utils.toArray('.gallery-image');

    // 1. DET PASSIVA SVÄVANDET
    gsap.to(images, {
      y: "+=20",
      rotation: "+=2",
      duration: 4,
      ease: "sine.inOut",
      yoyo: true,
      repeat: -1,
      stagger: {
        each: 0.3,
        from: "random"
      }
    });

    // 2. SCROLL-ANIMATIONEN (Flyg genom rymden)
    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: '.gallery-wrapper',
        start: 'top top',
        end: 'bottom bottom',
        scrub: 1, // Mjuk scrubbing
      }
    });

    images.forEach((img, index) => {
      // Sätt startposition långt in i skärmen och osynlig
      gsap.set(img, { z: -3000, opacity: 0 }); 

      // Animera framåt och fada in
      tl.to(img, {
        z: 800, // Åker förbi kameran
        opacity: 1,
        ease: "none",
        duration: 1
      }, index * 0.3) // Stagger baserat på index för att sprida ut dem i scrollen
      
      // Fada ut precis innan den klipper skärmen
      .to(img, {
        opacity: 0,
        duration: 0.2,
        ease: "power1.in"
      }, (index * 0.3) + 0.8);
    });
    // Lägg till denna logik i slutet av din <script>-tagg
gsap.registerPlugin(Flip);

// Spara en referens till det passiva svävet så vi kan pausa det
const floatAnimation = gsap.to(images, {
  y: "+=20", rotation: "+=2", duration: 4,
  ease: "sine.inOut", yoyo: true, repeat: -1,
  stagger: { each: 0.3, from: "random" }
});

images.forEach((img) => {
  img.addEventListener("click", function() {
    // 1. Pausa svävet och fixera scrollen
    floatAnimation.pause();
    document.body.style.overflow = "hidden";

    // 2. Registrera "First" (Nuvarande tillstånd i 3D-rymden)
    const state = Flip.getState(img);

    // 3. Flytta elementet i DOM:en till målet i case-vyn
    const target = document.getElementById("hero-target");
    target.appendChild(img);

    // Visa case-containern (Last)
    const caseView = document.getElementById("case-view");
    caseView.style.display = "block";

    // Sätt projekttiteln dynamiskt baserat på boxens text
    caseView.querySelector(".case-title").innerText = img.innerText;

    // Animera dolda textelement separat för en snygg komposition
    gsap.fromTo(".case-content", { opacity: 0, y: 30 }, { opacity: 1, y: 0, delay: 0.4 });

    // 4. Utför FLIP-animationen (Invert & Play)
    Flip.from(state, {
      duration: 0.8,
      ease: "power3.inOut",
      absolute: true, // Gör att elementet inte påverkar flödet under resans gång
      onComplete: () => {
        // Eventuella städåtgärder efter avslutad animation
      }
    });
  });
});

// Logik för att stänga caset och skicka tillbaka bilden till rymden
document.getElementById("close-btn").addEventListener("click", () => {
  const caseView = document.getElementById("case-view");
  const activeImage = document.getElementById("hero-target").querySelector(".gallery-image");
  
  if (!activeImage) return;

  // Hitta index eller klass för att veta var den ska i rymden (förenklat här åter till containern)
  const state = Flip.getState(activeImage);
  
  // Skicka tillbaka till galleriet
  document.querySelector(".gallery-container").appendChild(activeImage);
  caseView.style.style = ""; // Nollställ inline styles
  caseView.style.display = "none";

  Flip.from(state, {
    duration: 0.6,
    ease: "power3.out",
    absolute: true,
    onComplete: () => {
      document.body.style.overflow = "";
      floatAnimation.play();
    }
  });
});
gsap.registerPlugin(Draggable);

// Sprid ut korten lite asymmetriskt från start
gsap.utils.toArray(".swipe-card").forEach((card, i) => {
  gsap.set(card, { 
    rotation: gsap.utils.random(-4, 4), 
    x: gsap.utils.random(-10, 10),
    y: gsap.utils.random(-10, 10)
  });
});

// Gör alla kort draggbara
Draggable.create(".swipe-card", {
  type: "x,y",
  edgeResistance: 0.8,
  
  // När vi drar, rotera kortet lite baserat på hur långt vi drar (ger en naturlig känsla)
  onDrag: function() {
    gsap.to(this.target, { rotation: this.x * 0.05, duration: 0.1 });
  },

  // När vi släpper kortet
  onDragEnd: function() {
    // Om vi dragit det mer än 150px åt höger
    if (this.x > 150) {
      gsap.to(this.target, { 
        x: window.innerWidth, // Kasta ut ur bild
        opacity: 0, 
        duration: 0.4, 
        ease: "power2.in" 
      });
    } 
    // Om vi dragit det mer än 150px åt vänster
    else if (this.x < -150) {
      gsap.to(this.target, { 
        x: -window.innerWidth, // Kasta ut ur bild
        opacity: 0, 
        duration: 0.4, 
        ease: "power2.in" 
      });
    } 
    // Om vi inte dragit tillräckligt långt – snäpp tillbaka!
    else {
      gsap.to(this.target, { 
        x: gsap.utils.random(-10, 10), // Tillbaka till lite slarvig position
        y: gsap.utils.random(-10, 10), 
        rotation: gsap.utils.random(-4, 4), 
        duration: 0.5, 
        ease: "back.out(1.5)" // Studsig brutalist-effekt
      });
    }
  }
});
  </script>
  

</body>
</html>
