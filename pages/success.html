<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tack!</title>
<style>
   
body{
    font-family: monospace;
    font-size:16px;
    color:#333333;
    background: midnightblue;
}  
p{
    text-align: right;
}
main{
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
    }
.card{
    position: relative;
    width: 75%;
    max-width: 364px;
    padding: 24px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 1px 10px 0 rgb(53 58 62 / 6%), 0 2px 4px 0 rgb(53 58 62 / 8%);
    }
    small {
        text-transform: uppercase;
        font-size: .80em;
    }
    a{color:#333333;
       
    }
    #myTextPath {
  animation: moveText 20s linear infinite;
}
/*
path[Attributes Style] {
    d: path("M -83.5 491.665 C -5 318.664 99.0088 138.364 234.5 146.165 C 469 159.665 256.754 801.296 564.5 768.664 C 838 739.664 1068.16 35.6297 1330.5 60.6645 C 1582 84.6648 1289.5 540.664 1694.5 540.664");
    fill: none;
    stroke: rgb(28, 25, 23);
    stroke-width: 100;
    stroke-linecap: round;
    stroke-linejoin: round;
}*/
@keyframes moveText {
  0% {
    startOffset: -50%;
  }
  100% {
    startOffset: 100%;
  }
}
</style>
</head>
<body>

<main>
    <svg viewBox="-138.5 -19.3703 1888 875.6663000000001" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <path id="wavyPath" 
        d="M -83.5 491.665 C -5 318.664 99.0088 138.364 234.5 146.165 C 469 159.665 256.754 801.296 564.5 768.664 C 838 739.664 1068.16 35.6297 1330.5 60.6645 C 1582 84.6648 1289.5 540.664 1694.5 540.664" 
        fill="none" 
        stroke="#000000ff" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"/>

  <text font-family="sans-serif" font-size="56" fill="#80ff00">
    <textPath id="myTextPath" href="#wavyPath" startOffset="-100%">
     Tack för ditt meddelande!
      <animate 
        attributeName="startOffset" 
        from="50%" 
        to="-100%" 
        dur="20s" 
        repeatCount="indefinite" />
    </textPath>
  </text>
</svg>
      <p></p>
   <p> <small>◁ <a id="back-link" href="https://miriambensafiddine.se/">Tillbaks till startsidan</a></small></p>

</main>
<script>
    // Enkel evighetsloop
gsap.to("#myTextPath", {
  attr: { startOffset: "100%" },
  duration: 10,
  ease: "none",
  repeat: -1
});

// Eller koppla det till scroll (kräver ScrollTrigger)
gsap.to("#myTextPath", {
  attr: { startOffset: "100%" },
  ease: "none",
  scrollTrigger: {
    trigger: "svg",
    start: "top center",
    end: "bottom top",
    scrub: true // Texten rör sig fram och tillbaka med scrollen
  }
});</script>
</body>
</html>
